[versions]
agp = "9.1.1"
kotlin = "2.2.10"
composeBom = "2026.03.01"
wearCompose = "1.6.2"
activity = "1.12.4"
lifecycle = "2.10.0"
playServicesWearable = "19.0.0"
coroutines = "1.10.2"
adhan = "1.2.1"
playServicesLocation = "21.3.0"
junit = "4.13.2"
wearTiles = "1.5.0"
protolayout = "1.3.0"
complications = "1.2.1"
concurrentFutures = "1.2.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
adhan = { module = "com.batoulapps.adhan:adhan", version.ref = "adhan" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
wear-tiles = { module = "androidx.wear.tiles:tiles", version.ref = "wearTiles" }
wear-protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "protolayout" }
wear-complications = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "complications" }
concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "concurrentFutures" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
