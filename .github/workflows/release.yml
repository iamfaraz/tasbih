name: Release

# Run by hand from the Actions tab. Builds both signed APKs and publishes a GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number, such as 0.2.0
        required: true
        type: string
      notes:
        description: Optional summary shown above the list of changes
        required: false
        type: string
      prerelease:
        description: Mark as a pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The changelog needs the full history and tags.

      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.2.0"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION has already been released"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TASBIH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The TASBIH_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tasbih-release.jks"
          echo "TASBIH_KEYSTORE=$RUNNER_TEMP/tasbih-release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          TASBIH_KEYSTORE_PASSWORD: ${{ secrets.TASBIH_KEYSTORE_PASSWORD }}
          TASBIH_KEY_ALIAS: ${{ secrets.TASBIH_KEY_ALIAS }}
        run: |
          ./gradlew testDebugUnitTest :mobile:assembleRelease :wear:assembleRelease \
            -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Name the APKs
        run: |
          mkdir release
          cp mobile/build/outputs/apk/release/mobile-release.apk "release/tasbih-phone-$VERSION.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "release/tasbih-watch-$VERSION.apk"

      - name: Write the changelog
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            if [ -n "$NOTES" ]; then
              printf '%s\n\n' "$NOTES"
            fi
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log "$previous..HEAD" --no-merges --pretty='- %s'
              echo
              echo "**Full comparison:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...v$VERSION"
            else
              git log --no-merges --pretty='- %s'
            fi
            echo
            echo "## Install"
            echo
            echo "See the [README](https://github.com/$GITHUB_REPOSITORY#install). Install both APKs from the same release, so the phone and watch stay in step."
          } > release-notes.md

      - name: Publish the release
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" release/*.apk \
            --title "Tasbih $VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            "${flags[@]}"
